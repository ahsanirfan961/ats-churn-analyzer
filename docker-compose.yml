services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CHECKPOINT_DB_PATH: /data/checkpoints.sqlite
      SESSIONS_DB_PATH: /data/sessions.sqlite
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - agent-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  agent-data:
